services:
  # ─────────────────────────────────────────────
  # 1. FastAPI Backend — Python Web Service
  # ─────────────────────────────────────────────
  - type: web
    name: documind-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # Set manually in Render dashboard → keep secret
      - key: PINECONE_API_KEY
        sync: false
      # At least one of SUPABASE_JWT_SECRET / SUPABASE_URL is required — see backend/.env.example
      - key: SUPABASE_JWT_SECRET
        sync: false          # Supabase dashboard → API → JWT Secret (legacy HS256 projects)
      - key: SUPABASE_URL
        sync: false          # https://<ref>.supabase.co (projects using asymmetric JWT keys)
      - key: CORS_ALLOW_ORIGINS
        sync: false          # Comma-separated frontend origins, e.g. https://documind-frontend.onrender.com
      - key: PINECONE_INDEX_NAME
        value: documind
      - key: GEMINI_MODEL_NAME
        value: gemini-2.5-flash
      - key: PYTHON_VERSION
        value: "3.11"

  # ─────────────────────────────────────────────
  # 2. React Frontend — Static Site
  # ─────────────────────────────────────────────
  - type: web
    name: documind-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true   # Deploy preview on every PR
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false          # Set manually in Render dashboard
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_BACKEND_URL
        fromService:
          name: documind-backend
          type: web
          property: host      # Injects the bare hostname; the client prefixes https:// at runtime
    routes:
      - type: rewrite
        source: /*
        destination: /index.html  # SPA fallback for React Router
